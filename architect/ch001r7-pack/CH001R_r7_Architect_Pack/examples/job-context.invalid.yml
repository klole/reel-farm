  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      CH001_SANDBOX_STATE_DIR: ${{ runner.temp }}/ch001r6/${{ github.run_id }}-${{ github.run_attempt }}/sandbox
