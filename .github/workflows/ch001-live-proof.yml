name: CH-001 live proof — NOT release acceptance

on:
  workflow_dispatch:
    inputs:
      implementation_sha:
        description: Approved new full implementation SHA to exercise
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ch001-live-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REQUESTED_SHA: ${{ inputs.implementation_sha }}
      CI: "true"
      CH001_RUN_ID: r3-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Validate dispatch and runner class assumptions
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY_PRIVATE" == "false" ]] || { echo "This proof is approved only for the public standard-runner path." >&2; exit 1; }
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "A full approved implementation SHA is required." >&2; exit 1; }

      - name: Checkout approved implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: klole/reel-farm
          ref: ${{ inputs.implementation_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm exact committed source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git cat-file -e "$REQUESTED_SHA^{commit}"
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "CH001_IMPLEMENTATION_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CH001_WORKFLOW_SHA=${{ github.workflow_sha }}" >> "$GITHUB_ENV"
          mkdir -p "artifacts/ch001r3/$CH001_RUN_ID/public"
          printf 'Bounded CH-001R-r3 live proof; not v0.1 acceptance.\nImplementation: %s\nWorkflow definition: %s\nRun: %s\n' "$REQUESTED_SHA" "${{ github.workflow_sha }}" "$CH001_RUN_ID" > "artifacts/ch001r3/$CH001_RUN_ID/public/dispatch.txt"

      - name: Set up project-pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Install frozen project and pinned browser dependencies
        run: |
          set -euo pipefail
          corepack enable
          test "$(pnpm --version)" = "12.3.4"
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Probe Docker daemon and Compose
        continue-on-error: true
        run: |
          set -euo pipefail
          docker version
          docker info >/dev/null
          docker compose version

      - name: Execute bounded live proof
        id: proof
        run: |
          set +e
          pnpm proof:ch001
          proof_exit=$?
          echo "exit_code=$proof_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload sanitized evidence on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ch001-live-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ch001r3/r3-${{ github.run_id }}-${{ github.run_attempt }}/public/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish bounded-proof summary and preserve exit semantics
        if: ${{ always() }}
        run: |
          set -euo pipefail
          proof_exit='${{ steps.proof.outputs.exit_code }}'
          proof_exit="${proof_exit:-2}"
          {
            echo "## CH-001R-r3 bounded live proof"
            echo
            echo "Implementation: `$REQUESTED_SHA`"
            echo "Workflow definition: `${{ github.workflow_sha }}`"
            echo "Run: `$CH001_RUN_ID`"
            echo "Coordinator exit: `$proof_exit`"
            echo "Application acceptance: `false`"
            echo "Scope excludes providers, publishing, release, and v0.2."
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$proof_exit" == "0" ]] || exit "$proof_exit"
